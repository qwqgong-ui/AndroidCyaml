name: Functional tests

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      mihomo-revision:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - id: source
        env:
          REQUESTED_REVISION: ${{ inputs.mihomo-revision }}
        run: |
          set -euo pipefail
          commit="${REQUESTED_REVISION}"
          if [[ -z "${commit}" ]]; then
            commit="$(git ls-remote https://github.com/qwqgong-ui/mihomo.git refs/heads/dev | awk 'NR == 1 { print $1 }')"
          fi
          [[ "${commit}" =~ ^[0-9a-f]{40}$ ]]
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"

  native:
    needs: source
    name: Native / ${{ matrix.feature }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        feature: [dns, network, transport, wrapper]
    env:
      MIHOMO_REVISION: ${{ needs.source.outputs.commit }}
      GOMAXPROCS: "3"
      GO_TEST_PARALLELISM: "2"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache-dependency-path: native/mihomo/go.mod
      - name: Test feature without Android SDK or JNI
        run: |
          set -o pipefail
          bash scripts/build_mihomo.sh --test-group "${{ matrix.feature }}" 2>&1 | tee native-tests.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-tests-${{ matrix.feature }}
          path: native-tests.log
          retention-days: 7

  android-unit:
    name: Android / ${{ matrix.feature }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        feature: [network, controller, lifecycle, webview, settings]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android compile SDK
        run: |
          set -euo pipefail
          sdkmanager --channel=1 "cmdline-tools;latest"
          android_cli="$(find "${ANDROID_SDK_ROOT}/cmdline-tools" -path '*/bin/android' -type f -print | sort -V | tail -n 1)"
          "${android_cli}" --sdk="${ANDROID_SDK_ROOT}" sdk install platforms/android-37.0 build-tools/37.0.0 --beta
      - uses: gradle/actions/setup-gradle@v6
      - name: Run feature unit tests without building JNI
        run: bash scripts/test_android_unit.sh "${{ matrix.feature }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-tests-${{ matrix.feature }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 7
