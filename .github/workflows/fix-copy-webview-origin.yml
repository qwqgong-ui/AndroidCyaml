name: Apply WebView XHTTP origin fix

on:
  push:
    branches:
      - copy
    paths:
      - ".github/workflows/fix-copy-webview-origin.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: copy
          fetch-depth: 0

      - name: Patch WebView page origin
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/io/github/qwqgong/androidcyaml/WebViewXhttpDialer.java")
          source = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match, found {count}: {old[:100]!r}")
              source = source.replace(old, new, 1)

          replace_once(
              "import java.io.IOException;\nimport java.nio.charset.StandardCharsets;\n",
              "import java.io.IOException;\nimport java.net.URI;\nimport java.nio.charset.StandardCharsets;\nimport java.util.Locale;\n",
          )
          replace_once(
              '    private static final String BASE_URL = "https://androidcyaml.invalid/";\n',
              "",
          )
          replace_once(
              """    private final Handler mainHandler = new Handler(Looper.getMainLooper());
              private final ConcurrentHashMap<Long, Task> tasks = new ConcurrentHashMap<>();
              private final AtomicLong nextId = new AtomicLong(1L);
              private final CountDownLatch ready = new CountDownLatch(1);
              private final AtomicBoolean closed = new AtomicBoolean(false);
              private final WebViewConnectProxy connectProxy;
              private volatile WebView webView;
              private volatile String initializationError;
          """,
              """    private final Handler mainHandler = new Handler(Looper.getMainLooper());
              private final ConcurrentHashMap<Long, Task> tasks = new ConcurrentHashMap<>();
              private final AtomicLong nextId = new AtomicLong(1L);
              private final CountDownLatch webViewReady = new CountDownLatch(1);
              private final Object pageLock = new Object();
              private final AtomicBoolean closed = new AtomicBoolean(false);
              private final WebViewConnectProxy connectProxy;
              private volatile WebView webView;
              private volatile String initializationError;
              private volatile CountDownLatch pageReady = new CountDownLatch(0);
              private volatile String pageOrigin;
              private volatile String pageError;
          """,
          )
          replace_once(
              '            await(ready, 15_000L, "System WebView did not initialize");\n',
              '            await(webViewReady, 15_000L, "System WebView did not initialize");\n',
          )
          replace_once(
              """            String url = metadata.optString("url", "");
                      if (!url.startsWith("https://")) {
                          return errorResult("System WebView XHTTP only accepts https URLs");
                      }
                      connectProxy.register(url, metadata.optString("serverAddress", ""));
          """,
              """            String url = metadata.optString("url", "");
                      String origin = originOf(url);
                      ensurePageOrigin(origin);
                      connectProxy.register(url, metadata.optString("serverAddress", ""));
          """,
          )
          replace_once(
              """        if (closed.get()) {
                      initializationError = "System WebView XHTTP was closed during startup";
                      ready.countDown();
                      return;
                  }
          """,
              """        if (closed.get()) {
                      initializationError = "System WebView XHTTP was closed during startup";
                      webViewReady.countDown();
                      return;
                  }
          """,
          )
          replace_once(
              """            created.setWebViewClient(new WebViewClient());
                      webView = created;
                      created.loadDataWithBaseURL(BASE_URL, PAGE, "text/html", StandardCharsets.UTF_8.name(), null);
          """,
              """            created.setWebViewClient(new WebViewClient());
                      webView = created;
                      webViewReady.countDown();
          """,
          )
          replace_once(
              """            Log.e(TAG, initializationError, exception);
                      ready.countDown();
                  }
              }

              private void installProxyOverride() throws IOException {
          """,
              """            Log.e(TAG, initializationError, exception);
                      webViewReady.countDown();
                  }
              }

              private void ensurePageOrigin(String origin) throws IOException {
                  final CountDownLatch latch;
                  synchronized (pageLock) {
                      if (pageOrigin == null) {
                          pageOrigin = origin;
                          pageError = null;
                          pageReady = new CountDownLatch(1);
                          latch = pageReady;
                          mainHandler.post(() -> {
                              WebView current = webView;
                              if (current == null || closed.get()) {
                                  pageError = "System WebView is unavailable";
                                  latch.countDown();
                                  return;
                              }
                              try {
                                  current.loadDataWithBaseURL(
                                          origin + "/",
                                          PAGE,
                                          "text/html",
                                          StandardCharsets.UTF_8.name(),
                                          null
                                  );
                              } catch (RuntimeException exception) {
                                  pageError = "Unable to load System WebView XHTTP origin: "
                                          + (exception.getMessage() == null
                                          ? exception.getClass().getSimpleName()
                                          : exception.getMessage());
                                  latch.countDown();
                              }
                          });
                      } else if (!pageOrigin.equals(origin)) {
                          throw new IOException(
                                  "System WebView XHTTP runtime is already bound to "
                                          + pageOrigin + "; restart VPN before using " + origin
                          );
                      } else {
                          latch = pageReady;
                      }
                  }
                  await(latch, 15_000L, "System WebView XHTTP page did not initialize");
                  if (pageError != null) {
                      throw new IOException(pageError);
                  }
              }

              static String originOf(String urlValue) throws IOException {
                  final URI uri;
                  try {
                      uri = URI.create(urlValue == null ? "" : urlValue);
                  } catch (IllegalArgumentException exception) {
                      throw new IOException("Invalid System WebView XHTTP URL", exception);
                  }
                  if (!"https".equalsIgnoreCase(uri.getScheme())
                          || uri.getHost() == null
                          || uri.getHost().isBlank()
                          || uri.getUserInfo() != null) {
                      throw new IOException("System WebView XHTTP only accepts HTTPS origin URLs");
                  }
                  String host = uri.getHost().toLowerCase(Locale.ROOT);
                  if (host.indexOf(':') >= 0) {
                      host = '[' + host + ']';
                  }
                  int port = uri.getPort();
                  return "https://" + host + (port > 0 && port != 443 ? ":" + port : "");
              }

              private void installProxyOverride() throws IOException {
          """,
          )
          replace_once(
              """        public void onReady() {
                      ready.countDown();
                  }
          """,
              """        public void onReady() {
                      pageReady.countDown();
                  }
          """,
          )

          path.write_text(source, encoding="utf-8")
          PY

          cat > app/src/test/java/io/github/qwqgong/androidcyaml/WebViewXhttpOriginTest.java <<'EOF'
          package io.github.qwqgong.androidcyaml;

          import static org.junit.Assert.assertEquals;
          import static org.junit.Assert.assertThrows;

          import org.junit.Test;

          import java.io.IOException;

          public final class WebViewXhttpOriginTest {
              @Test
              public void normalizesHttpsOrigin() throws Exception {
                  assertEquals(
                          "https://plus.238139.xyz",
                          WebViewXhttpDialer.originOf(
                                  "https://PLUS.238139.XYZ:443/eb7cd544d5357f2989bdf75b.html?id=x"
                          )
                  );
                  assertEquals(
                          "https://[2001:db8::1]:8443",
                          WebViewXhttpDialer.originOf("https://[2001:db8::1]:8443/x")
                  );
              }

              @Test
              public void rejectsNonHttpsAndUserInfo() {
                  assertThrows(
                          IOException.class,
                          () -> WebViewXhttpDialer.originOf("http://example.com/x")
                  );
                  assertThrows(
                          IOException.class,
                          () -> WebViewXhttpDialer.originOf("https://user@example.com/x")
                  );
              }
          }
          EOF

          git diff --check

      - name: Commit origin fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/io/github/qwqgong/androidcyaml/WebViewXhttpDialer.java \
            app/src/test/java/io/github/qwqgong/androidcyaml/WebViewXhttpOriginTest.java
          git commit -m "fix: bind WebView XHTTP page to request origin"
          git push origin HEAD:copy
