name: Dispatch Android Release 0.6.146

on:
  workflow_dispatch:
  schedule:
    - cron: "5-55/10 21-22 31 7 *"
      timezone: "Asia/Tokyo"

permissions:
  actions: write
  contents: read

concurrency:
  group: dispatch-android-release-0.6.146
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch signed APK release when needed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          repo="${GITHUB_REPOSITORY}"
          if gh release view "v0.6.146" --repo "${repo}" >/dev/null 2>&1; then
            echo "Release v0.6.146 already exists."
            exit 0
          fi

          active="$(
            gh run list \
              --repo "${repo}" \
              --workflow release.yml \
              --branch main \
              --limit 20 \
              --json status \
              --jq '[.[] | select(.status != "completed")] | length'
          )"
          if (( active > 0 )); then
            echo "Signed release workflow is already active."
            exit 0
          fi

          gh workflow run release.yml --repo "${repo}" --ref main
          echo "Dispatched signed Android release workflow for v0.6.146."
