name: Signed Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/build.gradle.kts"
      - "scripts/build_mihomo.sh"
      - ".github/workflows/release.yml"

permissions:
  contents: write

concurrency:
  group: signed-android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version="$(sed -nE 's/^[[:space:]]*versionName = "([0-9]+\.[0-9]+\.[0-9]+)"/\1/p' app/build.gradle.kts | head -n 1)"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

          tag="v${version}"
          if gh release view "${tag}" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            exists=true
          else
            exists=false
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "exists=${exists}" >> "${GITHUB_OUTPUT}"
          echo "RELEASE_VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Stop when release already exists
        if: steps.release.outputs.exists == 'true'
        shell: bash
        run: echo "Release ${{ steps.release.outputs.tag }} already exists; nothing to publish."

      - uses: actions/setup-java@v5
        if: steps.release.outputs.exists != 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v7
        if: steps.release.outputs.exists != 'true'
        with:
          go-version: "1.26.x"
          cache: false

      - name: Cache Go modules and pinned mihomo JNI output
        if: steps.release.outputs.exists != 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            app/src/main/jniLibs/arm64-v8a/libmihomo.so
            app/src/main/cpp/generated/libmihomo.h
            .third_party/mihomo.commit
          key: ${{ runner.os }}-mihomo-go1.26-ndk29-${{ hashFiles('scripts/build_mihomo.sh', 'native/mihomo/go.mod', 'native/mihomo/main.go', 'patches/mihomo/*.patch') }}
          restore-keys: |
            ${{ runner.os }}-mihomo-go1.26-ndk29-

      - uses: android-actions/setup-android@v4
        if: steps.release.outputs.exists != 'true'

      - name: Install Android 17 SDK and NDK
        if: steps.release.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --channel=1 "cmdline-tools;latest"
          android_cli="$(
            find "${ANDROID_SDK_ROOT}/cmdline-tools" \
              -path '*/bin/android' -type f -print \
              | sort -V | tail -n 1
          )"
          [[ -x "${android_cli}" ]]
          "${android_cli}" --sdk="${ANDROID_SDK_ROOT}" sdk install \
            platforms/android-37.0 \
            build-tools/37.0.0 \
            --beta
          sdkmanager \
            "cmake;3.22.1" \
            "ndk;29.0.14206865"

      - uses: gradle/actions/setup-gradle@v6
        if: steps.release.outputs.exists != 'true'

      - name: Restore release signing key
        if: steps.release.outputs.exists != 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "${KEYSTORE_BASE64}" ]]
          [[ -n "${STORE_PASSWORD}" ]]
          [[ -n "${KEY_ALIAS}" ]]
          [[ -n "${KEY_PASSWORD}" ]]
          keystore="${RUNNER_TEMP}/androidcyaml-release.p12"
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${keystore}"
          chmod 600 "${keystore}"
          echo "ANDROID_SIGNING_STORE_FILE=${keystore}" >> "${GITHUB_ENV}"
          echo "ANDROID_SIGNING_STORE_PASSWORD=${STORE_PASSWORD}" >> "${GITHUB_ENV}"
          echo "ANDROID_SIGNING_KEY_ALIAS=${KEY_ALIAS}" >> "${GITHUB_ENV}"
          echo "ANDROID_SIGNING_KEY_PASSWORD=${KEY_PASSWORD}" >> "${GITHUB_ENV}"

      - name: Build, lint and verify optimized release APK
        if: steps.release.outputs.exists != 'true'
        shell: bash
        run: |
          set -o pipefail
          status=0
          ./gradlew \
            :app:testDebugUnitTest \
            :app:assembleRelease \
            :app:lintRelease \
            --stacktrace 2>&1 | tee build-release.log || status=$?
          if (( status == 0 )); then
            bash scripts/verify_native_runtime.sh \
              app/build/outputs/apk/release/app-release.apk 2>&1 | tee -a build-release.log || status=$?
          fi
          if (( status == 0 )); then
            bash scripts/verify_art_optimization.sh \
              app/build/outputs/apk/release/app-release.apk \
              app/build/outputs/mapping/release/mapping.txt \
              2>&1 | tee -a build-release.log || status=$?
          fi
          if (( status != 0 )); then
            while IFS= read -r report; do
              {
                echo
                echo "===== ${report} ====="
                cat "${report}"
              } | tee -a build-release.log
            done < <(find app/build -type f -name 'lint-results-*.txt' -print | sort)
          fi
          exit "${status}"

      - name: Verify and name release artifacts
        if: steps.release.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          source_apk="app/build/outputs/apk/release/app-release.apk"
          source_mapping="app/build/outputs/mapping/release/mapping.txt"
          source_symbols="app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip"
          release_apk="AndroidCyaml-v${RELEASE_VERSION}-arm64-v8a.apk"
          release_mapping="AndroidCyaml-v${RELEASE_VERSION}-mapping.txt"
          release_symbols="AndroidCyaml-v${RELEASE_VERSION}-native-debug-symbols.zip"
          "${ANDROID_SDK_ROOT}/build-tools/37.0.0/apksigner" \
            verify --verbose --print-certs "${source_apk}"
          "${ANDROID_SDK_ROOT}/build-tools/37.0.0/zipalign" \
            -c -P 16 -v 4 "${source_apk}"
          [[ -s "${source_mapping}" && -s "${source_symbols}" ]]
          cp "${source_apk}" "${release_apk}"
          cp "${source_mapping}" "${release_mapping}"
          cp "${source_symbols}" "${release_symbols}"
          sha256sum "${release_apk}" | tee SHA256SUMS

      - name: Upload signed release artifact
        if: steps.release.outputs.exists != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: AndroidCyaml-v${{ steps.release.outputs.version }}-signed
          path: |
            AndroidCyaml-v${{ steps.release.outputs.version }}-arm64-v8a.apk
            AndroidCyaml-v${{ steps.release.outputs.version }}-mapping.txt
            AndroidCyaml-v${{ steps.release.outputs.version }}-native-debug-symbols.zip
            SHA256SUMS
            build-release.log
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: steps.release.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" \
            "AndroidCyaml-v${RELEASE_VERSION}-arm64-v8a.apk" \
            "SHA256SUMS" \
            --target "${GITHUB_SHA}" \
            --title "AndroidCyaml v${RELEASE_VERSION}" \
            --generate-notes
