name: Signed Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/build.gradle.kts"
      - "scripts/build_mihomo.sh"
      - ".github/workflows/release.yml"

permissions:
  contents: write

concurrency:
  group: signed-android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version="$(sed -nE 's/^[[:space:]]*versionName = "([0-9]+\.[0-9]+\.[0-9]+)"/\1/p' app/build.gradle.kts | head -n 1)"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

          tag="v${version}"
          if gh release view "${tag}" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            exists=true
          else
            exists=false
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "exists=${exists}" >> "${GITHUB_OUTPUT}"
          echo "RELEASE_VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Stop when release already exists
        if: steps.release.outputs.exists == 'true'
        shell: bash
        run: echo "Release ${{ steps.release.outputs.tag }} already exists; nothing to publish."

      - uses: actions/setup-java@v5
        if: steps.release.outputs.exists != 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v7
        if: steps.release.outputs.exists != 'true'
        with:
          go-version: "1.26.x"
          cache: false

      - name: Cache Go modules and pinned mihomo JNI output
        if: steps.release.outputs.exists != 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            app/src/main/jniLibs/arm64-v8a/libmihomo.so
            app/src/main/cpp/generated/libmihomo.h
            .third_party/mihomo.commit
          key: ${{ runner.os }}-mihomo-go1.26-ndk29-${{ hashFiles('scripts/build_mihomo.sh', 'native/mihomo/go.mod', 'native/mihomo/*.go', 'patches/mihomo/*.patch') }}
          restore-keys: |
            ${{ runner.os }}-mihomo-go1.26-ndk29-

      - uses: android-actions/setup-android@v4
        if: steps.release.outputs.exists != 'true'

      - name: Install Android 17 SDK and NDK
        if: steps.release.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --channel=1 "cmdline-tools;latest"
          android_cli="$(
            find "${ANDROID_SDK_ROOT}/cmdline-tools" \
              -path '*/bin/android' -type f -print \
              | sort -V | tail -n 1
          )"
          [[ -x "${android_cli}" ]]
          "${android_cli}" --sdk="${ANDROID_SDK_ROOT}" sdk install \
            platforms/android-37.0 \
            build-tools/37.0.0 \
            --beta
          sdkmanager \
            "cmake;3.22.1" \
            "ndk;29.0.14206865"

      - uses: gradle/actions/setup-gradle@v6
        if: steps.release.outputs.exists != 'true'

      - name: Restore release signing key
        if: steps.release.outputs.exists != 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "${KEYSTORE_BASE64}" ]]
          [[ -n "${STORE_PASSWORD}" ]]
          [[ -n "${KEY_ALIAS}" ]]
          [[ -n "${KEY_PASSWORD}" ]]
          keystore="${RUNNER_TEMP}/androidcyaml-release.p12"
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${keystore}"
          chmod 600 "${keystore}"
          echo "ANDROID_SIGNING_STORE_FILE=${keystore}" >> "${GITHUB_ENV}"
          echo "ANDROID_SIGNING_STORE_PASSWORD=${STORE_PASSWORD}" >> "${GITHUB_ENV}"
          echo "ANDROID_SIGNING_KEY_ALIAS=${KEY_ALIAS}" >> "${GITHUB_ENV}"
          echo "ANDROID_SIGNING_KEY_PASSWORD=${KEY_PASSWORD}" >> "${GITHUB_ENV}"

      - name: Build, lint and verify optimized release APK
        if: steps.release.outputs.exists != 'true'
        shell: bash
        run: |
          set -o pipefail
          status=0
          ./gradlew \
            :app:testDebugUnitTest \
            :app:assembleRelease \
            :app:lintRelease \
            --stacktrace 2>&1 | tee build-release.log || status=$?
          if (( status == 0 )); then
            bash scripts/verify_native_runtime.sh \
              app/build/outputs/apk/release/app-release.apk \
              2>&1 | tee -a build-release.log || status=$?
          fi
          if (( status == 0 )); then
            bash scripts/verify_art_optimization.sh \
              app/build/outputs/apk/release/app-release.apk \
              app/build/outputs/mapping/release/mapping.txt \
              2>&1 | tee -a build-release.log || status=$?
          fi
          if (( status != 0 )); then
            while IFS= read -r report; do
              {
                echo
                echo "===== ${report} ====="
                cat "${report}"
              } | tee -a build-release.log
            done < <(find app/build -type f -name 'lint-results-*.txt' -print | sort)
          fi
          exit "${status}"

      - name: Verify and name release files
        if: steps.release.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          source_apk="app/build/outputs/apk/release/app-release.apk"
          source_mapping="app/build/outputs/mapping/release/mapping.txt"
          source_symbols="app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip"
          source_patch="patches/mihomo/0002-androidcyaml-webview-xhttp.patch"

          release_apk="AndroidCyaml-v${RELEASE_VERSION}-arm64-v8a.apk"
          release_mapping="AndroidCyaml-v${RELEASE_VERSION}-mapping.txt"
          release_symbols="AndroidCyaml-v${RELEASE_VERSION}-native-debug-symbols.zip"
          release_patch="AndroidCyaml-v${RELEASE_VERSION}-webview-xhttp.patch"
          release_commit="AndroidCyaml-v${RELEASE_VERSION}-commit.txt"
          release_log="AndroidCyaml-v${RELEASE_VERSION}-build.log"

          "${ANDROID_SDK_ROOT}/build-tools/37.0.0/apksigner" \
            verify --verbose --print-certs "${source_apk}"
          "${ANDROID_SDK_ROOT}/build-tools/37.0.0/zipalign" \
            -c -P 16 -v 4 "${source_apk}"
          [[ -s "${source_mapping}" && -s "${source_symbols}" && -s "${source_patch}" ]]

          cp "${source_apk}" "${release_apk}"
          cp "${source_mapping}" "${release_mapping}"
          cp "${source_symbols}" "${release_symbols}"
          cp "${source_patch}" "${release_patch}"
          cp build-release.log "${release_log}"
          printf '%s\n' "${GITHUB_SHA}" > "${release_commit}"

          sha256sum \
            "${release_apk}" \
            "${release_mapping}" \
            "${release_symbols}" \
            "${release_patch}" \
            "${release_commit}" \
            "${release_log}" \
            | tee SHA256SUMS

          cat > RELEASE_NOTES.md <<'EOF'
          ## 关键更新

          - 修复导入配置、应用运行时覆写、重启 mihomo 或重新开启 VPN 后，TUN 偶发仍显示已连接却无流量的问题。内嵌核心关闭时现在会同步清除 mihomo 保留的 TUN 配置，避免相同配置和相同文件描述符误判为无需重建监听器。
          - 新增 TUN 生命周期回归测试，并在每次 mihomo JNI 构建前执行，覆盖第二次进程内启动这一失效路径。
          - WebView XHTTP 下行支持协商式数据帧和 30 秒心跳，防止 Chromium 无法发送 HTTP/2 PING 时长期 GET 被空闲回收；不支持该扩展的服务端仍保持原始字节流兼容。
          - WebView 支持流式请求体时，`stream-one` 在内存中切换为 `stream-up`；否则继续回退 `packet-up`。用户 YAML 不改写。
          - 内置 Zashboard 更新至 v3.18.0。

          ## TUN 修复范围

          - 配置文件上传与切换。
          - 运行时覆写重新应用。
          - mihomo 核心停止后启动，以及 VPN 关闭后重新开启。
          - Android 原生 TUN 文件描述符数值被系统复用的场景。

          ## 当前限制

          - 仅支持标准 TLS XHTTP；REALITY、ShadowTLS、Restls、JLS、H3-only、Cookie placement 和 `download-settings` 会明确拒绝。
          - 当前回环 HTTP CONNECT 架构无法向 Chromium 提供目标 HTTPS DNS 元数据，因此没有实际 ECH；即使出现 ECH GREASE，也不代表 SNI 已加密。
          - 浏览器 Fetch 不提供同一请求的全双工响应，因此 WebView 路径会将 `stream-one` 拆分为 `stream-up` 上传与独立 GET 下行。

          ## 验证范围

          - Go TUN 生命周期回归测试、Debug 单元测试、Release R8、Android Lint、JNI/CGO arm64 构建。
          - JNI 导出、DEX 回调名称、SONAME、DT_NEEDED、16 KiB LOAD 对齐、APK 签名和 zipalign。
          - Android 16 真机覆盖连续 5 次核心重启、运行时覆写、停止/启动和配置导入；即使系统复用同一 TUN 文件描述符，网络流量仍能恢复。

          本页面下方 Assets 包含签名 APK、SHA-256、R8 mapping、native symbols、mihomo 补丁、构建日志和对应提交号。
          EOF

      - name: Upload signed release artifact
        if: steps.release.outputs.exists != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: AndroidCyaml-v${{ steps.release.outputs.version }}-signed
          path: |
            AndroidCyaml-v${{ steps.release.outputs.version }}-arm64-v8a.apk
            AndroidCyaml-v${{ steps.release.outputs.version }}-mapping.txt
            AndroidCyaml-v${{ steps.release.outputs.version }}-native-debug-symbols.zip
            AndroidCyaml-v${{ steps.release.outputs.version }}-webview-xhttp.patch
            AndroidCyaml-v${{ steps.release.outputs.version }}-commit.txt
            AndroidCyaml-v${{ steps.release.outputs.version }}-build.log
            SHA256SUMS
            RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: steps.release.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" \
            "AndroidCyaml-v${RELEASE_VERSION}-arm64-v8a.apk" \
            "AndroidCyaml-v${RELEASE_VERSION}-mapping.txt" \
            "AndroidCyaml-v${RELEASE_VERSION}-native-debug-symbols.zip" \
            "AndroidCyaml-v${RELEASE_VERSION}-webview-xhttp.patch" \
            "AndroidCyaml-v${RELEASE_VERSION}-commit.txt" \
            "AndroidCyaml-v${RELEASE_VERSION}-build.log" \
            "SHA256SUMS" \
            --target "${GITHUB_SHA}" \
            --title "AndroidCyaml v${RELEASE_VERSION}" \
            --notes-file RELEASE_NOTES.md
